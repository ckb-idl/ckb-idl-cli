name: Release binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: ckb-idl-x86_64-unknown-linux-gnu
            binary: ckb-idl
          - os: macos-latest
            name: ckb-idl-aarch64-apple-darwin
            binary: ckb-idl
          - os: windows-latest
            name: ckb-idl-x86_64-pc-windows-msvc
            binary: ckb-idl.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: cargo build --release --locked
      - name: Stage Unix asset
        if: runner.os != 'Windows'
        run: |
          cp target/release/${{ matrix.binary }} ${{ matrix.name }}
          shasum -a 256 ${{ matrix.name }} > ${{ matrix.name }}.sha256
      - name: Stage Windows asset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item target/release/${{ matrix.binary }} ${{ matrix.name }}.exe
          (Get-FileHash ${{ matrix.name }}.exe -Algorithm SHA256).Hash.ToLower() + "  ${{ matrix.name }}.exe" | Out-File -Encoding ascii ${{ matrix.name }}.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}*

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
